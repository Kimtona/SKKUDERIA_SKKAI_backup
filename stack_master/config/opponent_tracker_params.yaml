detect:
  ros__parameters:
    # rate: 40 # rate at which the node is running
    rate: 20 # lowered from 40: Jetson CPU saturation (load ~9), tracking is the pricey one
    lambda: 10 # minimum reliable detection angle in degrees
    sigma: 0.03 # standard deviation of the lidar range noise in m
    min_2_points_dist: 0.01 # minimum distance used by L-shape fitting
    min_obs_size: 10 # minimum cluster size in lidar points
    min_obs_size_m: 0.1 # minimum fitted obstacle size
    # max_obs_size: 1.0
    max_obs_size: 0.5 # was baked into perception_launch.xml; yaml is the source of truth now
    new_cluster_threshold_m: 0.4
    max_viewing_distance: 9.0
    boundaries_inflation: 0.1
    # filter_kernel_size: 11 # positive odd pixel count
    filter_kernel_size: 11 # 0.35 m wall margin: verified phantom-free over 90s of laps (11 leaked wall flickers; min_obs_size_m must stay 0.1, box fits as small as 0.15)
    max_tf_staleness: 0.05 # exact-stamp TF lookup races localization by 2-16 ms; fallback to latest TF is accepted up to this age (s)
    map_name: test0811
    measure: false
    from_bag: false

tracking:
  ros__parameters:
    # rate: 40 # rate at which the node is running
    rate: 20 # lowered from 40: python node, ~44% CPU at 40 Hz
    P_vs: 0.2 # proportional gain for the vs
    P_d: 0.02 # proportional gain for the d
    P_vd: 0.2 # proportional gain for the vd
    measurment_var_s: 0.002 # variance of measurement noise in s
    measurment_var_d: 0.002 # variance of measurement noise in d
    measurment_var_vs: 0.2
    measurment_var_vd: 0.2
    # process_var_vs/vd and var_pub are read with .integer_value in tracking.py,
    # so they MUST stay integers here. Writing 2.0 silently yields 0, which zeroes
    # the process noise and makes the filter trust its motion model completely.
    process_var_vs: 2 # process velocity noise in s
    process_var_vd: 8 # process velocity noise in d
    max_dist: 0.5 # max distance for association
    var_pub: 1 # obstacles with bigger variance are not published
    measure: false
    from_bag: false

    # ---- dynamically reconfigurable params ----
    # These were previously implicit: the node fell back to the defaults hardcoded
    # in StaticDynamic.__init__ and could not be tuned from a params file at all
    # (declare_parameter's return value was discarded and the on_set callback was
    # registered afterwards, so a yaml value showed up in `ros2 param get` while
    # the code kept using its own default). That is fixed, so the values below are
    # now the real source of truth. Every one of them is set to what the code
    # default already was -- this block changes no behaviour, it only makes the
    # tuning visible and editable.

    # --- opponent (dynamic) track ---
    ttl_dynamic: 40 # ticks the opponent KF survives without a match -> 40/20Hz = 2.0 s
    ratio_to_glob_path: 0.6 # target speed as a fraction of the raceline speed, used while the opponent is unseen

    # --- static / unclassified tracks ---
    ttl_static: 3 # ticks a track survives without a match, once it counts as visible -> 0.15 s at 20 Hz
    min_nb_meas: 5 # measurements needed before static/dynamic is decided at all
    min_std: 0.16 # below this s/d spread a track votes "static"
    max_std: 0.2 # above this it is certainly dynamic
    vs_reset: 0.1 # [m/s] a dynamic track slower than this for 10+ ticks reverts to static

    # --- association ---
    aggro_multi: 2.0 # max_dist multiplier for dynamic obstacles (predicted position); 1.0 = no widening

    # --- memory / visibility ---
    dist_deletion: 7.0 # [m] only inside this s-distance can a static track have its ttl decremented
    dist_infront: 8.0 # [m] horizon for the isInFront flag
    noMemoryMode: false # true = never remember static obstacles (decrement ttl every tick). HMCL-UNIST run true here

    # --- publishing ---
    publish_static: true # forward static obstacles to /perception/obstacles
    publish_unclassified: true # forward not-yet-classified blobs too; false costs min_nb_meas/rate = 0.25 s of reaction time
    debug_mode: false
