bridge:
  ros__parameters:
    # topics and namespaces
    ego_namespace: 'car_state'
    ego_scan_topic: 'scan'
    ego_odom_topic: 'odom'
    ego_pose_topic: 'pose' 
    ego_opp_odom_topic: 'opp_odom'
    ego_drive_topic: 'drive'
    opp_namespace: 'opp_racecar'
    opp_scan_topic: 'opp_scan'
    opp_odom_topic: 'odom'
    opp_ego_odom_topic: 'opp_odom'
    opp_drive_topic: 'opp_drive'

    # transform related
    scan_distance_to_base_link: 0.27

    # laserscan parameters
    scan_fov: 4.7
    scan_beams: 1080

    # map parameters
    map_img_ext: '.png'

    # RViz "Publish Point" obstacle size, as a cell radius: the painted block is
    # (2 * obstacle_size)^2 cells at 0.05 m/cell, so 4 -> 0.40 m square.
    #
    # NOT the bridge's own default of 2 (0.20 m), because a 0.20 m obstacle is
    # invisible to `detect` however well the LiDAR sees it. detect segments the scan
    # and drops any cluster under min_obs_size = 10 laser points; with gym's
    # 4.7 rad / 1080 beams = 0.00435 rad per beam, an obstacle of side w at range r
    # spans w / (r * 0.00435) points, so 0.20 m only clears 10 points inside 4.6 m
    # -- measured 8 points at 5.5 m, and perception published nothing at all.
    # 0.40 m clears it out to ~9.2 m, which covers detect's max_viewing_distance of
    # 9.0 m, while staying under max_obs_size = 0.5 m (measured size 0.385 m).
    # One click is then enough; at 0.20 m it took a 2x2 block of clicks.
    obstacle_size: 4

    # opponent parameters
    # 2 agents: the opponent car doubles as an obstacle the ego's LiDAR actually
    # sees, since RaceCar.ray_cast_agents() casts against its body outline. Leave
    # it parked (publish /opp_drive once with speed 0) for a static obstacle, or
    # drive it for a dynamic one.
    # NOTE: with num_agent > 1 the bridge only steps the sim once BOTH /drive and
    # /opp_drive have been published at least once -- a never-published /opp_drive
    # freezes the whole simulation, ego included.
    # 1 for time trials -- a second car parked on the raceline is just an
    # obstacle nothing reacts to, since time_trials_launch.xml starts no
    # perception. Put it back to 2 for any overtake work.
    num_agent: 1

    # Starting poses. These are MAP-SPECIFIC and there is no guard: the bridge
    # spawns the cars at these raw map coordinates whatever `map_name` says.
    # Spawning off the raceline is not a cosmetic problem. f110_gym latches
    # collisions -- base_classes.py check_ttc() returns True forever once
    # `in_collision` is set and the speed has reached 0, and update_pose() then
    # skips integration -- so a car that clips a wall on its first step is stuck
    # for the rest of the run. With num_agent 2 that freezes the ego as well and
    # the whole sim sits still while /drive keeps commanding a healthy speed.
    #
    # Values below are read off the map's own IQP raceline
    # (stack_master/maps/<map_name>/global_waypoints.json); psi_rad in that file
    # is already the map-frame yaw, so stheta is a straight copy. Every map has
    # its own raceline, so switching maps means switching this block, and the
    # value below is only whichever map was launched last:
    #     scripts/sim_map.sh <map_name>                 rewrites it and launches
    #     scripts/map_sectors.py <map_name> --spawn-only --set-spawn   rewrites
    #                                                   it and stops there
    #
    # Sitting on the raceline is deliberate: off it, the opponent falls outside
    # spline_planner's obs_traj_tresh and never triggers an evasion at all.
    #
    # ACTIVE MAP: skku_track_22x8 -- ego s = 0.0 m, opponent s = 8.0 m
    sx: 3.3022
    sy: -0.4889
    stheta: -0.0039
    sx1: 11.2862
    sy1: -0.5337
    stheta1: 0.0083

    # hangar_1905_v0 -- ego s = 0.0 m, opponent s = 12.0 m on the long straight
    # (d_left 1.70 m / d_right 0.40 m). Swap back in when launching that map.
    #   sx: 0.4732
    #   sy: 0.5489
    #   stheta: 0.0086
    #   sx1: 3.5300
    #   sy1: 11.1000
    #   stheta1: 1.5700

    # teleop
    kb_teleop: True
