bridge:
  ros__parameters:
    # topics and namespaces
    ego_namespace: 'car_state'
    ego_scan_topic: 'scan'
    ego_odom_topic: 'odom'
    ego_pose_topic: 'pose' 
    ego_opp_odom_topic: 'opp_odom'
    ego_drive_topic: 'drive'
    opp_namespace: 'opp_racecar'
    opp_scan_topic: 'opp_scan'
    opp_odom_topic: 'odom'
    opp_ego_odom_topic: 'opp_odom'
    opp_drive_topic: 'opp_drive'

    # transform related
    scan_distance_to_base_link: 0.27

    # laserscan parameters, matched to the /scan the real car actually publishes.
    #
    # That scan is not the GL-5's raw output: `pc_to_scan` bins the driver's
    # pointcloud, and config/sensors.yaml pins the result at angle_min -2.356,
    # angle_max 2.356, angle_increment 0.00314 -- 270 deg at the GL-5's
    # 0.18 deg/beam, which is ceil(4.712 / 0.00314) = 1501 beams.
    #
    # 4.712 / (1501 - 1) = 0.0031416 rad, so the published scan comes out at the
    # real angle_min, angle_max and angle_increment to five decimals.
    #
    # Two patches are needed for this to be more than a relabelling, both in
    # .sim_patches: the bridge never passed these to the simulator, which traced
    # f110_gym's 1080-beam default regardless, and it derived the increment as
    # fov / n rather than fov / (n - 1).
    #
    # Gym's defaults were 1080 beams over 4.7 rad, i.e. 0.00435 rad/beam, 39%
    # coarser than the car. Everything downstream that counts points or converts
    # an index to an angle was therefore reading a different sensor in sim than
    # on the car: min_obs_size is 10 LiDAR points, the detector's adaptive
    # breakpoint threshold is a function of angle_increment, and FTG's
    # ftg_range_offset / ftg_safety_radius are in beam-index units sized for
    # 1501. See config/SIM/sim_state_machine_overrides.yaml for what that last
    # one did to FTG.
    #
    # One incidental gain: f110_gym looks its ray angles up in a 2000-step table
    # over 2*pi, so its angular resolution is 0.00314 rad. At 1080 beams the
    # 0.00435 rad spacing does not land on that grid and beams get quantised
    # unevenly; at 1501 the spacing is one table step exactly.
    scan_fov: 4.712
    scan_beams: 1501

    # The GL-5 turns at 40 Hz, and sensors.yaml carries that as pc_to_scan's
    # scan_time 0.025. The bridge published scans from the same 100 Hz timer as
    # the odometry, so the stack was fed 2.5 scans for every one the car gets --
    # free reaction time for anything that acts per scan, perception and FTG
    # included. Its own timer now, so the sim step and /car_state/odom stay at
    # 100 Hz; see .sim_patches patch 10.
    scan_rate_hz: 40.0

    # map parameters
    map_img_ext: '.png'

    # RViz "Publish Point" obstacle size, as a cell radius: the painted block is
    # (2 * obstacle_size)^2 cells at 0.05 m/cell, so 4 -> 0.40 m square.
    #
    # NOT the bridge's own default of 2 (0.20 m). detect segments the scan and
    # drops any cluster under min_obs_size = 10 laser points, so an obstacle of
    # side w at range r has to clear w / (r * angle_increment) >= 10.
    #
    # At the 0.00314 rad/beam this file now asks for, 0.20 m reaches 10 points
    # inside 6.4 m and 0.40 m covers the whole of detect's max_viewing_distance
    # of 9.0 m, with room under max_obs_size = 0.5 m (measured size 0.385 m).
    # 0.40 m is kept because it is the size that holds across the range, and one
    # click of it is enough where 0.20 m took a 2x2 block.
    #
    # This was the harder constraint at gym's old 0.00435 rad/beam, where 0.20 m
    # only cleared 10 points inside 4.6 m -- measured 8 points at 5.5 m, with
    # perception publishing nothing at all.
    obstacle_size: 4

    # opponent parameters
    # 2 agents: the opponent car doubles as an obstacle the ego's LiDAR actually
    # sees, since RaceCar.ray_cast_agents() casts against its body outline. Leave
    # it parked (publish /opp_drive once with speed 0) for a static obstacle, or
    # drive it for a dynamic one.
    # NOTE: with num_agent > 1 the bridge only steps the sim once BOTH /drive and
    # /opp_drive have been published at least once -- a never-published /opp_drive
    # freezes the whole simulation, ego included.
    # 1 for time trials -- a second car parked on the raceline is just an
    # obstacle nothing reacts to, since time_trials_launch.xml starts no
    # perception. Put it back to 2 for any overtake work.
    num_agent: 1

    # Starting poses. These are MAP-SPECIFIC and there is no guard: the bridge
    # spawns the cars at these raw map coordinates whatever `map_name` says.
    # Spawning off the raceline is not a cosmetic problem. f110_gym latches
    # collisions -- base_classes.py check_ttc() returns True forever once
    # `in_collision` is set and the speed has reached 0, and update_pose() then
    # skips integration -- so a car that clips a wall on its first step is stuck
    # for the rest of the run. With num_agent 2 that freezes the ego as well and
    # the whole sim sits still while /drive keeps commanding a healthy speed.
    #
    # Values below are read off the map's own IQP raceline
    # (stack_master/maps/<map_name>/global_waypoints.json); psi_rad in that file
    # is already the map-frame yaw, so stheta is a straight copy. Every map has
    # its own raceline, so switching maps means switching this block, and the
    # value below is only whichever map was launched last:
    #     scripts/sim_map.sh <map_name>                 rewrites it and launches
    #     scripts/map_sectors.py <map_name> --spawn-only --set-spawn   rewrites
    #                                                   it and stops there
    #
    # Sitting on the raceline is deliberate: off it, the opponent falls outside
    # spline_planner's obs_traj_tresh and never triggers an evasion at all.
    #
    # ACTIVE MAP: skku_track_22x8_wide -- ego s = 0.0 m, opponent s = 8.0 m
    sx: 2.1721
    sy: -0.5842
    stheta: -0.0750
    sx1: 10.1576
    sy1: -0.6087
    stheta1: 0.0344

    # hangar_1905_v0 -- ego s = 0.0 m, opponent s = 12.0 m on the long straight
    # (d_left 1.70 m / d_right 0.40 m). Swap back in when launching that map.
    #   sx: 0.4732
    #   sy: 0.5489
    #   stheta: 0.0086
    #   sx1: 3.5300
    #   sy1: 11.1000
    #   stheta1: 1.5700

    # teleop
    kb_teleop: True
