# Simulation-only planner overrides.
#
# Loaded ONLY when a launch is started with sim:=True, on top of each node's
# built-in defaults, so the real car keeps its own tuning untouched. Put sim
# tuning here rather than editing shared config or node defaults.

spline_planner:
  ros__parameters:
    # Tuned by measuring ego-to-opponent centre distance at closest approach, not
    # by watching state transitions: the car reaches OVERTAKE and completes laps
    # just the same while driving straight through the opponent, so lap counts and
    # state logs prove nothing here.
    #
    # The default 0.2 m puts the evasion line 0.29999 m from a parked opponent,
    # a hair under state_machine's lateral_width_ot_m (0.3 m), so _check_ofree
    # rejects it every cycle and the car never commits. Too large is worse: the
    # spline then breaches the track bounds, spline_planner logs "Evasion
    # trajectory too close to TRACKBOUNDS, aborting evasion" and publishes an
    # EMPTY waypoint array, which looks identical to having no obstacle at all.
    #
    # 0.50 m sits between those failures. Measured on glc_ot_ez with a parked
    # opponent: 7 of 8 approaches cleared at 0.36-0.51 m centre-to-centre, with
    # zero TRACKBOUNDS aborts. Cars are 0.2032 m wide, so anything under ~0.25 m
    # is an overlap.
    #
    # This value is track-dependent. Usable lateral room is
    #     min(d_left | d_right) over the spline's +/-4 m span  -  spline_bound_mindist
    # which is 0.586 m on glc_ot_ez but only 0.364 m on GLC_smile_small -- on that
    # map the evasion is aborted on essentially every approach and the car drives
    # through the opponent. Re-check this number before trusting a new map.
    evasion_dist: 0.50
