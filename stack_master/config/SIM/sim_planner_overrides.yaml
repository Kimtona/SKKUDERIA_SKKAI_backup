# Simulation-only planner overrides.
#
# Loaded ONLY when a launch is started with sim:=True, on top of each node's
# built-in defaults, so the real car keeps its own tuning untouched. Put sim
# tuning here rather than editing shared config or node defaults.

spline_planner:
  ros__parameters:
    # NOTE: everything in this file was inert until 2026-08-13. spline_planner
    # registered its on-set-parameters callback AFTER declaring the parameters,
    # so a params file set the ROS parameter -- `ros2 param get` reported it --
    # while the node went on reading the Python attributes from its own
    # __init__. Fixed in spline_planner.py by applying the declared values once.
    # Any tuning here that predates that fix was never actually measured.
    #
    # evasion_dist is the lateral clearance the apex is placed at beyond the
    # obstacle's edge. 0.80 was picked long ago against a parked opponent and
    # never took effect; the first run that actually applied it spent 67% of the
    # time TRAILING and completed one lap, because an apex that large is capped
    # by the track bounds and then rejected by the state machine's _check_ofree.
    # The node default that had silently been in force instead, 0.4, is what the
    # passing step 2 and step 3 runs were measured on, so keep it explicit here.
    evasion_dist: 0.40

    # Pre-apex control points, lengthened from the node defaults of 3.0/2.0/1.0.
    #
    # The spline is built through [pre_2, pre_1, pre_0, apex, post_0, post_1,
    # post_2] with d = 0 everywhere except the apex, so pre_apex_2 is the point
    # where the evasion is pinned back to the raceline. At the default 1.0 the
    # ENTIRE lateral move is compressed into the last metre before the apex.
    #
    # That is survivable against a parked obstacle, whose apex sits still and
    # lets the ego arrive. Against a moving one the apex recedes at the
    # opponent's speed, so the ego sits outside that last metre almost the whole
    # chase and is asked for nothing. Measured on hangar_1905_v0 as the fraction
    # of the apex offset actually demanded at the ego's own position:
    #
    #   apex ahead      3.0/2.0/1.0      6.0/4.0/2.5
    #     0.0-1.0 m         0.40             0.94
    #     1.0-1.5 m         0.13             0.47
    #     1.5-2.0 m         0.03             0.19
    #     2.0-3.0 m         0.06             0.16
    #
    # and end to end: max offset demanded at the ego 0.228 -> 0.513 m, max offset
    # the ego actually reached 0.245 -> 0.519 m. The controller was never the
    # problem -- it tracked the reference to within 0.10 m throughout; there was
    # simply no reference to track.
    #
    # This is what makes step 3 pass: 178 s with zero collisions and five clean
    # passes of a 1.5 m/s opponent at 0.453-0.517 m centre-to-centre, against a
    # rear-end within 92 s before.
    #
    # SIM-scoped. The same reasoning applies to the real car, but the numbers
    # come from gym's opponent and hangar's geometry, so it needs its own pass
    # against real data.
    pre_apex_0: 6.0
    pre_apex_1: 4.0
    pre_apex_2: 2.5

    # Cap the apex at the largest one the track bounds allow instead of throwing
    # the whole evasion away when it does not fit.
    #
    # The TRACKBOUNDS check rejects the entire spline as soon as one sample sits
    # within spline_bound_mindist of its bound, and publishes an EMPTY waypoint
    # array -- indistinguishable in the logs from having no obstacle at all. It
    # fired 27 times over a 178 s run even on runs that otherwise overtake fine.
    #
    # It never had to be discovered that way. The spline's control values are
    # zero everywhere but the apex, scipy's InterpolatedUnivariateSpline is
    # linear in those values, and clip(k*f, 0, k) == k*clip(f, 0, 1) -- both
    # verified numerically to 1e-15 -- so evasion_d[i] == d_apex * shape[i] with
    # shape independent of d_apex. The check is then just
    #     |d_apex| <= (|tb_i| - spline_bound_mindist) / shape[i]  for all i
    # and the tightest bound is the answer in closed form. Capping to it makes
    # the abort unreachable by construction; the check stays as a safety net.
    #
    # A capped apex that is too small to clear the opponent is not a hazard: the
    # state machine's _check_ofree already refuses OVERTAKE when the evasion line
    # passes within lateral_width_ot_m of the obstacle. A reduced apex is strictly
    # more information than an empty array.
    #
    # SIM-scoped because spline_planner is shared with the real car; the node
    # default is False, so the real car is unaffected.
    adaptive_apex: true
