soslab_gl5:
  ros__parameters:
    lidarType: "GL5"
    ip_address_device: "10.110.1.2"
    ip_port_device: 2020
    ip_address_pc: "10.110.1.3"
    ip_port_pc: 3000
    pc_topic_lidar0: "soslab/pointcloud"
    frame_id: "laser"
    max_intensity: 3000

pc_to_scan:
  ros__parameters:
    target_frame: "laser"
    transform_tolerance: 0.01
    # GL-5 is 2D; height filter is meaningless, open wide
    min_height: -10.0
    max_height:  10.0
    # GL-5 spec: 270 deg FoV, 0.18 deg / beam, 40 Hz, 9 m range
    # Widened to +/- pi to safely include edge beams (extra bins fill with inf)
    angle_min: -3.14
    angle_max:  3.14
    angle_increment: 0.00314
    scan_time: 0.025
    range_min: 0.1
    range_max: 9.0
    use_inf: true
    concurrency_level: 1
  